u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 2\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eTypes of Machine Learning-based Data Analysis\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eWhen analyzing a large amount of data with machine learning technology, patterns that were invisible outwardly can be found, called data mining. Data mining deals with the following four problems.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e1. Classification\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e2. Prediction\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e3. Clustering\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e4. Association Rule\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 3\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThere are various criteria and perspectives for classifying machine learning-based data analysis techniques. But in general, they are classified into supervised learning and self-learning (or unsupervised learning), depending on the existence of objective variables (or response variables, output target values, etc.). They can also be classified as reinforcement learning and semi-supervised learning.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 4\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eSupervised Learning\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eSupervised learning focuses on expressing the relationship between explanatory variables (also known as independent variables, features, etc.) and objective variables (also known as response variables, dependent variables, target variables, output values, etc.) as well as predicting future observations. It is suitable for solving problems for recognition, classification, diagnosis, and prediction.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eMain techniques in supervised learning can be reclassified into classification and numerical prediction techniques. This depends on the form of the objective variable (or response variable, dependent variable), whether it is a numerical (quantitative variable) or categorical (qualitative variable).\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe training data injected into the algorithm includes a desired answer called the label.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 5\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eMain Techniques and Algorithms for Supervised Learning \u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 6\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eSelf-Learning (or Unsupervised Learning)\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eSelf-learning or unsupervised learning is a form in which learning is performed without information on objective variables (or response variables, dependent variables, target variables, and output values). It is mainly used for problems such as description, characteristic derivation, and pattern derivation.  \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eIn general, supervised learning techniques have clear and distinct predictive purposes. Compared to those, self-learning techniques have a stronger nature of data mining to search for useful information or patterns without prior information. \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 7\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eImportant Unsupervised Learning Algorithms\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 8\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eInstance-based Learning Vs. Model-based Learning\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eInstance-based Learning: The system learns by remembering training samples. It is generalized by comparing new data and learned samples using similarity measurements. \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eModel-based Learning: The system creates a model from a sample and uses it for prediction.\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cb\u003e\u003cstrong\u003eRefer to Figure 9\u003c/strong\u003e\u003c/b\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cbr/\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1a:Tc33,"])</script><script>self.__next_f.push([1,"\u003cp dir=\"ltr\"\u003e\u003cspan\u003e𝗪𝗵𝗮𝘁 𝗜𝘀 𝗮𝗻 𝗔𝗜 𝗔𝗴𝗲𝗻𝘁 𝗮𝗻𝗱 𝗪𝗵𝘆 𝗜𝘁 𝗜𝘀 𝗡𝗼𝘁 𝗝𝘂𝘀𝘁 𝗔𝘂𝘁𝗼𝗺𝗮𝘁𝗶𝗼𝗻\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e𝗗𝗲𝗳𝗶𝗻𝗶𝘁𝗶𝗼𝗻:\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAn 𝗔𝗜 𝗔𝗴𝗲𝗻𝘁 is software that can 𝗽𝗲𝗿𝗰𝗲𝗶𝘃𝗲 𝘁𝗵𝗲 𝘀𝗶𝘁𝘂𝗮𝘁𝗶𝗼𝗻, 𝗺𝗮𝗸𝗲 𝗱𝗲𝗰𝗶𝘀𝗶𝗼𝗻𝘀, 𝗮𝗻𝗱 𝘁𝗮𝗸𝗲 𝗮𝗰𝘁𝗶𝗼𝗻𝘀 𝗮𝘂𝘁𝗼𝗻𝗼𝗺𝗼𝘂𝘀𝗹𝘆 𝘁𝗼 𝗮𝗰𝗵𝗶𝗲𝘃𝗲 𝗮 𝗴𝗼𝗮𝗹, instead of only following fixed rules.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003 em integration.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e𝗞𝗲𝘆 𝗧𝗮𝗸𝗲𝗮𝘄𝗮𝘆\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eAutomation follows fixed rules. AI agents work toward goals.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"AI\" href=\"/community/hashtag/12008/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#AI\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"AIAgents\" href=\"/community/hashtag/23833/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#AIAgents\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"LearnByDoing\" href=\"/community/hashtag/24572/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#LearnByDoing\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"1b:Tea3,"])</script><script>self.__next_f.push([1,"\u003cp dir=\"ltr\"\u003e\u003cgfg-hashtag\u003e\u003ca data-hashtag-text=\"RoastMyResume\" href=\"/community/hashtag/26244/\"\u003e\u003cspan class=\"GFGEditorTheme__hashtag\"\u003e#RoastMyResume\u003c/span\u003e\u003c/a\u003e\u003c/gfg-hashtag\u003e\u003cspan\u003e Received. Levels Gained. | My Resume 2.0\u003c/span\u003e\u003cbr/\u003e\u003cbr/\u003e\u003cspan\u003eThe \"After\" Story: A few days ago, I put my resume in the line of fire. I asked for the brutal truth, and honestly? The community didn't hold back 😭 .\u003c/span\u003e\u003cbr/\u003e\u003cbr/\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003eThe Evolution i made : \u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- Focusing on Impact\u003c/span\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u003cspan\u003e- The \"Product-Engineer\" Mindset\u003c/span\u003e\u003c/p\u003e
