name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install 

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint || true # Prevent lint errors from blocking deployment

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci || npm install

      - name: Build Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Build Execution Engine Docker Image
        working-directory: ./execution-engine/docker
        run: docker build -t execution-engine-python:latest -f python.Dockerfile ..

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Remote Build)
        # Using direct deployment from the root. Vercel automatically finds the frontend folder based on Project Settings.
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend-and-engine:
    name: Deploy Backend & Engine to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            PROJECT_DIR="~/CodeHive"
            
            # --- AUTO-SETUP LOGIC ---
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Performing initial clone..."
              git clone https://github.com/kishan-1001/CodeHive.git $PROJECT_DIR
            fi
            
            cd $PROJECT_DIR
            
            # Update code
            git fetch origin main
            git reset --hard origin/main
            
            # --- EXECUTION ENGINE ---
            echo "Building Docker execution engine..."
            cd execution-engine/docker
            docker build -t execution-engine-python:latest -f python.Dockerfile ..
            cd ../..
            
            # --- BACKEND ---
            echo "Setting up backend..."
            cd backend
            npm ci || npm install
            npm run build
            
            # Restart or Start service
            # We assume 'codehive-backend' is the name in pm2
            pm2 restart codehive-backend || pm2 start dist/server.js --name "codehive-backend"
            pm2 save
