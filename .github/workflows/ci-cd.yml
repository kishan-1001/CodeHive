name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install # fallback to install if package-lock is out of sync

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci || npm install

      - name: Build Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Build Execution Engine Docker Image
        working-directory: ./execution-engine/docker
        run: docker build -t execution-engine-python:latest -f python.Dockerfile ..

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend-and-engine:
    name: Deploy Backend & Engine to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory
            PROJECT_DIR="~/CodeHive"
            
            if [ -d "$PROJECT_DIR" ]; then
              cd $PROJECT_DIR
              
              # Pull the latest code
              git pull origin main
              
              # Build execution engine docker image locally on the EC2 server
              cd execution-engine/docker
              docker build -t execution-engine-python:latest -f python.Dockerfile ..
              cd ../..
              
              # Setup backend
              cd backend
              npm ci || npm install
              npm run build
              
              # Restart the backend service. We assume you run the backend using pm2.
              pm2 restart codehive-backend || pm2 start dist/server.js --name "codehive-backend"
            else
              echo "Project directory $PROJECT_DIR not found on EC2 instance."
              echo "Please clone the repository initially into ~/CodeHive to enable deployments."
              exit 1
            fi
